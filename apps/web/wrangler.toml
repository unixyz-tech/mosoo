"$schema" = "../../node_modules/wrangler/config-schema.json"

name = "mosoo-web"
compatibility_date = "2026-06-01"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
# Domain and HTTPS redirects must run before static asset matches.
run_worker_first = true
# The Worker (src/worker.ts) owns SPA fallback so unknown console paths can be
# handled by react-router.
not_found_handling = "none"

[env.prod]
name = "mosoo-web-prod"
workers_dev = false

[env.prod.placement]
region = "aws:us-west-2"

[[env.prod.routes]]
pattern = "mosoo-web.unixyz.tech"
custom_domain = true

[[env.prod.services]]
binding = "API"
service = "mosoo-api-prod"

[env.sit]
name = "mosoo-web-sit"
workers_dev = false

[env.sit.placement]
region = "aws:us-west-2"

[[env.sit.routes]]
pattern = "mosoo-web-sit.unixyz.tech"
custom_domain = true

[[env.sit.services]]
binding = "API"
service = "mosoo-api-sit"
